name: Build Nexus Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract browser project
        run: |
          mkdir -p browser-project
          unzip -o nexus-project.zip -d browser-project
          test -f browser-project/package.json

      - name: Build Nexus APK
        working-directory: browser-project
        run: |
          npm ci
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm run build
          printf '{"appId":"com.uzairmuneeb.nexus","appName":"Nexus","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Android-APK
          path: browser-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
