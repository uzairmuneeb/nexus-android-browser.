
name: Build Nexus Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract project ZIP
        run: |
          mkdir extracted
          ZIP="$(find . -maxdepth 1 -name '*.zip' | head -n 1)"
          test -n "$ZIP"
          unzip -q "$ZIP" -d extracted
          PKG="$(find extracted -name package.json -not -path '*/node_modules/*' | head -n 1)"
          test -n "$PKG"
          echo "PROJECT_DIR=$(dirname "$PKG")" >> "$GITHUB_ENV"

      - name: Build web app and Android wrapper
        run: |
          cd "$PROJECT_DIR"
          npm ci
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm run build
          npx cap init Nexus com.uzairmuneeb.nexus --web-dir dist
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Android-APK
          path: extracted/**/android/app/build/outputs/apk/debug/app-debug.apk
